server:
  port: 8080

spring:
  application:
    name: gestion-stock
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestion_stock}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:stock}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # le schéma est géré uniquement par Flyway
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # A CHANGER en production (au moins 32 caractères) via la variable d'environnement JWT_SECRET
    secret: ${JWT_SECRET:changez-moi-cette-cle-secrete-doit-faire-32-caracteres-minimum}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  admin:
    # Compte créé au premier démarrage s'il n'existe aucun utilisateur
    login: ${ADMIN_LOGIN:admin}
    password: ${ADMIN_PASSWORD:admin123}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

logging:
  file:
    name: logs/gestion-stock.log
  level:
    com.gestionstock: INFO
